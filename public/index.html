<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kahaniyaan — Stories</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>📖 Kahaniyaan</h1>
  <a href="/admin.html">Admin / Upload</a>
</header>

<main>
  <div id="storyContainer">
    <p class="empty">Loading stories...</p>
  </div>
</main>

<script src="/track.js"></script>
<script>
  async function loadStories() {
    const res = await fetch("/api/stories");
    const stories = await res.json();
    const container = document.getElementById("storyContainer");

    if (!stories.length) {
      container.innerHTML = '<p class="empty">Abhi koi story upload nahi hui hai.</p>';
      return;
    }

    container.innerHTML = "";
    stories.forEach((story) => {
      const card = document.createElement("div");
      card.className = "story-card";
      const date = new Date(story.createdAt).toLocaleDateString();
      card.innerHTML = `
        <h2>${escapeHtml(story.title)}</h2>
        <div class="story-meta">by ${escapeHtml(story.author)} · ${date}</div>
        <div class="story-preview">${escapeHtml(story.content).slice(0, 120)}...</div>
        <div class="story-full">${escapeHtml(story.content)}</div>
      `;
      card.addEventListener("click", () => {
        const wasOpen = card.classList.contains("open");
        card.classList.toggle("open");
        track(wasOpen ? "story_closed" : "story_opened", story.title);
      });
      container.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  loadStories();
</script>
</body>
</html>
